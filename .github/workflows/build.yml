name: build

on:
  workflow_dispatch:
  push:
    paths:
      - 'roblox-sandbox/App/**'
      - 'roblox-sandbox/Base/**'
      - 'roblox-sandbox/Network/**'
      - 'roblox-sandbox/CSG/**'
      - 'roblox-sandbox/Rendering/**'
      - 'roblox-sandbox/ClientBase/**'
      - 'roblox-sandbox/ClientShared/**'
      - 'roblox-sandbox/Win/**'
      - 'roblox-sandbox/WindowsClient/**'
      - 'roblox-sandbox/RCCService/**'
      - 'roblox-sandbox/boostlibs/**'
      - 'roblox-sandbox/fmod/**'
      - 'roblox-sandbox/Library/**'
      - 'roblox-sandbox/PropertySheets/**'
      - 'roblox-sandbox/CustomBuildRules.*'
      - 'roblox-sandbox/Roblox.sln'
      - '.github/workflows/build.yml'

env:
  BOOST_VERSION: "1.74.0"
  BOOST_URL: "https://archives.boost.io/release/1.74.0/source/boost_1_74_0.zip"

jobs:
  build-rcc:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Init MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Restore intermediates
        uses: actions/cache/restore@v4
        with:
          path: roblox-sandbox/**/obj
          key: w32-rcc-${{ github.sha }}
          restore-keys: w32-rcc-
      - name: Fill Boost sources
        shell: cmd
        run: |
          copy /Y roblox-sandbox\Library\boost\boost\config\user.hpp "%RUNNER_TEMP%\rbx_user.hpp" >nul
          if not exist roblox-sandbox\Library\boost\tools\build\src\build-system.jam (
            curl -L -o boost.zip %BOOST_URL%
            7z x -y boost.zip >nul
            robocopy boost_1_74_0 roblox-sandbox\Library\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
            robocopy boost_1_74_0\boost roblox-sandbox\Library\boost\include\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
          )
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\boost\config\user.hpp >nul
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\include\boost\config\user.hpp >nul
      - name: Build RCCService
        shell: cmd
        working-directory: roblox-sandbox
        run: msbuild Roblox.sln -m -p:Configuration=ReleaseRcc -p:Platform=Win32 -flp:logfile=build-rcc.log;verbosity=normal
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Recurse -Include RCCService.exe | ForEach-Object { Copy-Item $_.FullName artifacts/ }
      - uses: actions/upload-artifact@v4
        with:
          name: rcc-exe
          path: roblox-sandbox/artifacts/RCCService.exe
      - name: Save intermediates
        if: always()
        uses: actions/cache/save@v4
        with:
          path: roblox-sandbox/**/obj
          key: w32-rcc-${{ github.sha }}

  build-client:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Init MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Restore intermediates
        uses: actions/cache/restore@v4
        with:
          path: roblox-sandbox/**/obj
          key: w32-client-${{ github.sha }}
          restore-keys: w32-client-
      - name: Fill Boost sources
        shell: cmd
        run: |
          copy /Y roblox-sandbox\Library\boost\boost\config\user.hpp "%RUNNER_TEMP%\rbx_user.hpp" >nul
          if not exist roblox-sandbox\Library\boost\tools\build\src\build-system.jam (
            curl -L -o boost.zip %BOOST_URL%
            7z x -y boost.zip >nul
            robocopy boost_1_74_0 roblox-sandbox\Library\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
            robocopy boost_1_74_0\boost roblox-sandbox\Library\boost\include\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
          )
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\boost\config\user.hpp >nul
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\include\boost\config\user.hpp >nul
      - name: Build WindowsClient
        shell: cmd
        working-directory: roblox-sandbox
        run: msbuild Roblox.sln -m -p:Configuration=Release -p:Platform=Win32 -flp:logfile=build-client.log;verbosity=normal
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Recurse -Include RobloxPlayerBetaRaw.exe | ForEach-Object { Copy-Item $_.FullName artifacts/ }
      - uses: actions/upload-artifact@v4
        with:
          name: client-exe
          path: roblox-sandbox/artifacts/RobloxPlayerBetaRaw.exe
      - name: Save intermediates
        if: always()
        uses: actions/cache/save@v4
        with:
          path: roblox-sandbox/**/obj
          key: w32-client-${{ github.sha }}

  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [build-rcc, build-client]
    steps:
      - uses: actions/download-artifact@v4
      - name: Combine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item rcc-exe/RCCService.exe bin/
          Copy-Item client-exe/RobloxPlayerBetaRaw.exe bin/
          Get-ChildItem bin
      - name: Smoke-run RCCService
        shell: cmd
        timeout-minutes: 3
        run: |
          cd bin
          RCCService.exe -Console
          echo EXIT_CODE=%ERRORLEVEL%