name: build

on:
  workflow_dispatch:
  push:
    paths:
      - 'roblox-sandbox/App/**'
      - 'roblox-sandbox/Base/**'
      - 'roblox-sandbox/Network/**'
      - 'roblox-sandbox/CSG/**'
      - 'roblox-sandbox/Rendering/**'
      - 'roblox-sandbox/ClientBase/**'
      - 'roblox-sandbox/ClientShared/**'
      - 'roblox-sandbox/Win/**'
      - 'roblox-sandbox/WindowsClient/**'
      - 'roblox-sandbox/RCCService/**'
      - 'roblox-sandbox/boostlibs/**'
      - 'roblox-sandbox/fmod/**'
      - 'roblox-sandbox/Library/**'
      - 'roblox-sandbox/PropertySheets/**'
      - 'roblox-sandbox/CustomBuildRules.*'
      - 'roblox-sandbox/Roblox.sln'
      - '.github/workflows/build.yml'

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Initialize MSVC x86 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Locate ATLMFC headers across installed MSVC toolsets
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "VS install: $vs"
          $found = $null
          Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | ForEach-Object {
            $inc = Join-Path $_.FullName "atlmfc\include\atlbase.h"
            if (Test-Path $inc) { Write-Host "ATLMFC present under $($_.Name)"; if (-not $found) { $found = $_.FullName } }
            else { Write-Host "no atlmfc under $($_.Name)" }
          }
          if ($found) {
            "ATLMFC_ROOT=$found" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "::error::No ATLMFC headers found under any MSVC toolset"
            exit 1
          }

      - name: Fill stripped Boost sources from official 1.74.0 release
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          rem Stash the Roblox-customized config before any fill can touch it
          copy /Y roblox-sandbox\Library\boost\boost\config\user.hpp "%RUNNER_TEMP%\rbx_user.hpp" >nul
          if not exist roblox-sandbox\Library\boost\tools\build\src\build-system.jam (
            echo Restoring stripped Boost pieces from official 1.74.0 release
            curl -L -o boost_1_74_0.zip https://archives.boost.io/release/1.74.0/source/boost_1_74_0.zip
            7z x -y boost_1_74_0.zip >nul
            robocopy boost_1_74_0 roblox-sandbox\Library\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
            rem Release zips put headers in boost\; our tree consumes the git-layout include\boost\ (normally made by b2 install)
            robocopy boost_1_74_0\boost roblox-sandbox\Library\boost\include\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
          ) else (
            echo Boost build system present, nothing to restore
          )
          rem Restore Roblox config to BOTH layouts unconditionally
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\boost\config\user.hpp >nul
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\include\boost\config\user.hpp >nul
          echo ==DIAG-userhpp==
          findstr /L /C:"ROBLOX_BOOST_CONFIGS" roblox-sandbox\Library\boost\boost\config\user.hpp >nul && echo ROOT_HAS_MACRO || echo ROOT_MISSING_MACRO
          findstr /L /C:"ROBLOX_BOOST_CONFIGS" roblox-sandbox\Library\boost\include\boost\config\user.hpp >nul && echo INCLUDE_HAS_MACRO || echo INCLUDE_MISSING_MACRO
          exit /b 0

      - name: Build RCCService (ReleaseRcc)
        shell: cmd
        working-directory: roblox-sandbox
        run: |
          rem ATLMFC dirs are injected by roblox-sandbox\Directory.Build.targets
          rem from the ATLMFC_ROOT environment property (MSBuild derives
          rem INCLUDE/LIB for cl from properties, not the process env).
          msbuild Roblox.sln -m -p:Configuration=ReleaseRcc -p:Platform=Win32 -flp:logfile=build-rcc.log;verbosity=normal

      - name: Build WindowsClient (Release)
        shell: cmd
        working-directory: roblox-sandbox
        run: |
          msbuild Roblox.sln -m -p:Configuration=Release -p:Platform=Win32 -flp:logfile=build-client.log;verbosity=normal

      - name: Collect binaries
        shell: pwsh
        run: |
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem -Recurse -Include RCCService.exe,RobloxPlayerBetaRaw.exe | ForEach-Object { Copy-Item $_.FullName -Destination $out }
          Get-ChildItem -Recurse -Include fmod.dll -Path roblox-sandbox\fmod\win32 | ForEach-Object { Copy-Item $_.FullName -Destination $out }
          Get-ChildItem $out

      - name: Build VMProtectSDK32 stub dll
        shell: cmd
        run: |
          copy /Y roblox-sandbox\Library\VMProtect\stub\VMProtectSDK_stub.c artifacts\ >nul
          copy /Y roblox-sandbox\Library\VMProtect\stub\VMProtectSDK32.def artifacts\ >nul
          cl /nologo /LD /Fe artifacts\VMProtectSDK32.dll artifacts\VMProtectSDK_stub.c /DEF artifacts\VMProtectSDK32.def /link /MACHINE:X86
          del artifacts\VMProtectSDK_stub.c artifacts\VMProtectSDK32.def artifacts\VMProtectSDK_stub.obj >nul 2>&1

      - name: Build d3dx9_35 stub dll
        shell: pwsh
        working-directory: ${{ github.workspace }}/artifacts
        run: |
          Set-Content d3dx9_35_stub.c "#include <windows.h>"
          Add-Content d3dx9_35_stub.c "void* __stdcall D3DXGetShaderConstantTable(unsigned long shader) { return 0; }"
          Set-Content d3dx9_35.def "LIBRARY d3dx9_35"
          Add-Content d3dx9_35.def "EXPORTS"
          Add-Content d3dx9_35.def "    D3DXGetShaderConstantTable"
          cl /nologo /LD d3dx9_35_stub.c /DEF d3dx9_35.def /link /MACHINE:X86

      - name: Dump exe dependencies
        shell: cmd
        run: dumpbin /DEPENDENTS artifacts\RCCService.exe

      - name: Smoke-run RCCService -Console
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Join-Path (Get-Location) "artifacts\RCCService.exe"
          if (-not (Test-Path $exe)) { Write-Error "RCCService.exe not found"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "-Console" -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput rcc_out.txt -RedirectStandardError rcc_err.txt
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            if (Test-Path rcc_out.txt) { Get-Content rcc_out.txt | Select-Object -Last 30 }
            if (Test-Path rcc_err.txt) { Get-Content rcc_err.txt | Select-Object -Last 30 }
            Write-Error "::error::RCCService exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "SMOKE_OK: RCCService alive at T+12s"

      - name: Upload artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            artifacts/
            roblox-sandbox/build-rcc.log
            roblox-sandbox/build-client.log
            rcc_out.txt
            rcc_err.txt
          if-no-files-found: ignore

  wine-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: windows-build
    env:
      WINEARCH: win32
      WINEPREFIX: /home/runner/.wine_sandbox
      WINEDEBUG: -all
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: artifact

      - name: Install Wine (i386)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32 winetricks

      - name: Init 32-bit prefix + era CRT
        run: |
          wineboot --init || true
          winetricks -q vcrun2015 || echo "winetricks vcrun2015 reported failure (may already satisfy); continuing"

      - name: Smoke-run RCCService under Wine
        run: |
          mkdir -p run && cp artifact/RCCService.exe artifact/fmod.dll run/ 2>/dev/null || true
          cd run
          wine RCCService.exe -Console > rcc_out.log 2>&1 &
          WPID=$!
          sleep 12
          if kill -0 $WPID 2>/dev/null; then
            echo "SMOKE_OK: RCCService alive at T+12s under Wine"
            kill $WPID 2>/dev/null || true
            wineserver -k 2>/dev/null || true
          else
            echo "RCCService exited early under Wine; last output:"
            tail -40 rcc_out.log
            exit 1
          fi
