name: build

on:
  workflow_dispatch:
  push:
    paths:
      - 'roblox-sandbox/App/**'
      - 'roblox-sandbox/Base/**'
      - 'roblox-sandbox/Network/**'
      - 'roblox-sandbox/CSG/**'
      - 'roblox-sandbox/Rendering/**'
      - 'roblox-sandbox/ClientBase/**'
      - 'roblox-sandbox/ClientShared/**'
      - 'roblox-sandbox/Win/**'
      - 'roblox-sandbox/WindowsClient/**'
      - 'roblox-sandbox/RCCService/**'
      - 'roblox-sandbox/boostlibs/**'
      - 'roblox-sandbox/fmod/**'
      - 'roblox-sandbox/Library/**'
      - 'roblox-sandbox/PropertySheets/**'
      - 'roblox-sandbox/CustomBuildRules.*'
      - 'roblox-sandbox/Roblox.sln'

env:
  BOOST_VERSION: "1.74.0"
  BOOST_URL: "https://archives.boost.io/release/1.74.0/source/boost_1_74_0.zip"

permissions:
  contents: write

jobs:
  build-rcc:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Init MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Locate ATLMFC headers
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $found = $null
          Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | ForEach-Object {
            $inc = Join-Path $_.FullName "atlmfc\include\atlbase.h"
            if (Test-Path $inc) { $found = $_.FullName }
          }
          if ($found) { "ATLMFC_ROOT=$found" | Out-File -FilePath $env:GITHUB_ENV -Append }
          else { Write-Host "::error::No ATLMFC headers found"; exit 1 }
      - name: Restore intermediates
        uses: actions/cache/restore@v4
        with:
          path: roblox-sandbox/**/obj
          key: w32-rcc-${{ github.sha }}
          restore-keys: w32-rcc-
      - name: Fill Boost sources
        shell: cmd
        run: |
          copy /Y roblox-sandbox\Library\boost\boost\config\user.hpp "%RUNNER_TEMP%\rbx_user.hpp" >nul
          if not exist roblox-sandbox\Library\boost\tools\build\src\build-system.jam (
            curl -L -o boost.zip %BOOST_URL%
            7z x -y boost.zip >nul
            robocopy boost_1_74_0 roblox-sandbox\Library\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
            robocopy boost_1_74_0\boost roblox-sandbox\Library\boost\include\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
          )
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\boost\config\user.hpp >nul
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\include\boost\config\user.hpp >nul
      - name: Build RCCService
        shell: cmd
        working-directory: roblox-sandbox
        run: msbuild Roblox.sln -m -p:Configuration=ReleaseRcc -p:Platform=Win32 -flp:logfile=build-rcc.log;verbosity=normal
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Recurse -Include RCCService.exe | ForEach-Object { Copy-Item $_.FullName artifacts/ }
      - uses: actions/upload-artifact@v4
        with:
          name: rcc-exe
          path: artifacts/RCCService.exe
          if-no-files-found: error
      - name: Save intermediates
        if: always()
        uses: actions/cache/save@v4
        with:
          path: roblox-sandbox/**/obj
          key: w32-rcc-${{ github.sha }}

  build-client:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Init MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Locate ATLMFC headers
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $found = $null
          Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | ForEach-Object {
            $inc = Join-Path $_.FullName "atlmfc\include\atlbase.h"
            if (Test-Path $inc) { $found = $_.FullName }
          }
          if ($found) { "ATLMFC_ROOT=$found" | Out-File -FilePath $env:GITHUB_ENV -Append }
          else { Write-Host "::error::No ATLMFC headers found"; exit 1 }
      - name: Restore intermediates
        uses: actions/cache/restore@v4
        with:
          path: roblox-sandbox/**/obj
          key: w32-client-${{ github.sha }}
          restore-keys: w32-client-
      - name: Fill Boost sources
        shell: cmd
        run: |
          copy /Y roblox-sandbox\Library\boost\boost\config\user.hpp "%RUNNER_TEMP%\rbx_user.hpp" >nul
          if not exist roblox-sandbox\Library\boost\tools\build\src\build-system.jam (
            curl -L -o boost.zip %BOOST_URL%
            7z x -y boost.zip >nul
            robocopy boost_1_74_0 roblox-sandbox\Library\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
            robocopy boost_1_74_0\boost roblox-sandbox\Library\boost\include\boost /E /NFL /NDL /NP
            if errorlevel 8 exit /b 1
          )
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\boost\config\user.hpp >nul
          copy /Y "%RUNNER_TEMP%\rbx_user.hpp" roblox-sandbox\Library\boost\include\boost\config\user.hpp >nul
      - name: Build WindowsClient
        shell: cmd
        working-directory: roblox-sandbox
        run: msbuild Roblox.sln -m -p:Configuration=Release -p:Platform=Win32 -flp:logfile=build-client.log;verbosity=normal
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Recurse -Include RobloxPlayerBetaRaw.exe | ForEach-Object { Copy-Item $_.FullName artifacts/ }
      - uses: actions/upload-artifact@v4
        with:
          name: client-exe
          path: artifacts/RobloxPlayerBetaRaw.exe
          if-no-files-found: error
      - name: Save intermediates
        if: always()
        uses: actions/cache/save@v4
        with:
          path: roblox-sandbox/**/obj
          key: w32-client-${{ github.sha }}

  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [build-rcc, build-client]
    steps:
      - uses: actions/checkout@v4
      - name: Init MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-exe'
          merge-multiple: true
          path: bin
      - name: Verify
        shell: pwsh
        run: |
          Get-ChildItem bin
          if (-not (Test-Path bin/RCCService.exe)) { Write-Error "Missing RCCService.exe"; exit 1 }
          if (-not (Test-Path bin/RobloxPlayerBetaRaw.exe)) { Write-Error "Missing RobloxPlayerBetaRaw.exe"; exit 1 }
      - name: Install era VC runtimes (x86)
        shell: cmd
        run: |
          choco install vcredist2012 vcredist2013 -y --ignore-package-exit-codes
      - name: Build stub DLLs (seconds)
        shell: cmd
        working-directory: bin
        run: |
          copy /Y ..\roblox-sandbox\Library\VMProtect\stub\VMProtectSDK_stub.c . >nul
          copy /Y ..\roblox-sandbox\Library\VMProtect\stub\VMProtectSDK32.def . >nul
          cl /nologo /LD VMProtectSDK_stub.c /DEF VMProtectSDK32.def /FeVMProtectSDK32.dll /link /MACHINE:X86
          if not exist VMProtectSDK32.dll exit /b 1
          del VMProtectSDK_stub.c VMProtectSDK32.def VMProtectSDK_stub.obj VMProtectSDK_stub.lib VMProtectSDK_stub.exp >nul 2>&1
          echo void* __stdcall D3DXGetShaderConstantTable(unsigned long s) { return 0; } > d3dx9_35_stub.c
          echo LIBRARY d3dx9_35 > d3dx9_35.def
          echo EXPORTS >> d3dx9_35.def
          echo     D3DXGetShaderConstantTable >> d3dx9_35.def
          cl /nologo /LD d3dx9_35_stub.c /DEF d3dx9_35.def /Fed3dx9_35.dll /link /MACHINE:X86
          if not exist d3dx9_35.dll exit /b 1
          del d3dx9_35_stub.c d3dx9_35.def d3dx9_35_stub.obj d3dx9_35_stub.lib d3dx9_35_stub.exp >nul 2>&1
          echo --- bin contents ---
          dir /B
      - name: Copy fmod.dll
        shell: pwsh
        run: Copy-Item roblox-sandbox\fmod\win32\fmod.dll bin/
      - name: Copy SDL2.dll
        shell: pwsh
        run: |
          $sha = (Get-FileHash roblox-sandbox\Library\SDL2\lib\x86\SDL2.dll).Hash.ToLower()
          if ($sha -ne 'ce15334fe253ff38b887214f57bc76a7d4286a346ad09e909f21c4a640003f86') {
            Write-Host "::error::SDL2.dll hash mismatch: $sha"
            exit 1
          }
          Copy-Item roblox-sandbox\Library\SDL2\lib\x86\SDL2.dll bin\
      - name: Copy runtime data directories
        shell: pwsh
        run: |
          foreach ($d in @('content','shaders','PlatformContent')) {
            if (Test-Path "roblox-sandbox\$d") {
              Copy-Item -Path "roblox-sandbox\$d" -Destination bin\ -Recurse -Force
            }
          }
          foreach ($f in @(
            'roblox-sandbox/RCCService/AppSettings.xml',
            'roblox-sandbox/RCCService/gameserver.txt',
            'roblox-sandbox/WindowsClient/AppSettings.xml'
          )) {
            if (Test-Path $f) { Copy-Item $f bin\ }
          }
          Get-ChildItem bin | Select-Object Name, Length
      - name: Dump dependents of provisioned modules
        shell: cmd
        run: |
          echo === RCCService.exe ===
          dumpbin /DEPENDENTS bin\RCCService.exe
          echo === RobloxPlayerBetaRaw.exe ===
          dumpbin /DEPENDENTS bin\RobloxPlayerBetaRaw.exe
          echo === fmod.dll ===
          dumpbin /DEPENDENTS bin\fmod.dll
          echo === VMProtectSDK32.dll ===
          dumpbin /DEPENDENTS bin\VMProtectSDK32.dll
          echo === d3dx9_35.dll ===
          dumpbin /DEPENDENTS bin\d3dx9_35.dll
      - name: Recursive import audit
        shell: pwsh
        run: python tools/audit_win_deps.py bin
      - name: Smoke-run RCCService
        shell: pwsh
        timeout-minutes: 4
        run: |
          Push-Location bin
          $p = Start-Process -FilePath ".\RCCService.exe" -ArgumentList "-Console" -PassThru -NoNewWindow `
                 -RedirectStandardOutput "rcc-stdout.log" -RedirectStandardError "rcc-stderr.log"
          $deadline = (Get-Date).AddSeconds(60)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if ($p.HasExited) {
            Write-Host "::error::RCCService exited during startup, code 0x$('{0:X}' -f $p.ExitCode)"
            Get-Content rcc-stdout.log | ForEach-Object { Write-Host "stdout| $_" }
            Get-Content rcc-stderr.log | ForEach-Object { Write-Host "stderr| $_" }
            Write-Host "--- Application event log entries mentioning RCCService ---"
            try {
              Get-WinEvent -LogName Application -MaxEvents 80 |
                Where-Object { $_.Message -match 'RCCService' } |
                ForEach-Object { Write-Host "[$($_.TimeCreated)] $($_.Message)" }
            } catch { Write-Host "event log query failed: $_" }
            Pop-Location
            exit 1
          }
          Write-Host "RCCService stayed alive for 60s - SMOKE_OK"
          Stop-Process -Id $p.Id -Force
          Pop-Location
      - name: Diagnose RCCService crash (minidump stack + artifacts)
        if: failure()
        shell: pwsh
        run: |
          $logsDir = Join-Path $env:LOCALAPPDATA "Roblox\logs"
          Write-Host "diag| logs dir: $logsDir"
          $dumps = @()
          if (Test-Path $logsDir) {
            $dumps = Get-ChildItem -Path $logsDir -Recurse -Include *.dmp -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending
            $dumps | ForEach-Object { Write-Host "diag| dump: $($_.FullName) ($($_.Length) bytes)" }
          } else { Write-Host "diag| logs dir missing" }
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x86\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Host "diag| cdb not present, skipping stack analysis" }
          elseif ($dumps.Count -eq 0) { Write-Host "diag| no dumps found" }
          else {
            $dump = $dumps[0].FullName
            Push-Location bin
            try {
              $env:_NT_SYMBOL_PATH = "srv*;D:\a\sandbox\sandbox\bin"
              & "$cdb" -z "$dump" -c "!analyze -v;q" 2>&1 |
                ForEach-Object { Write-Host "stack| $_" }
            } catch { Write-Host "diag| cdb failed: $_" }
            Pop-Location
          }
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs
          path: |
            bin/rcc-stdout.log
            bin/rcc-stderr.log
            ${{ env.LOCALAPPDATA }}\Roblox\logs\
      - name: Two-sided smoke (logging proxy + RCC + client join handshake)
        shell: pwsh
        timeout-minutes: 8
        run: |
          Push-Location bin

          $proxy = "http://127.0.0.1:64989"
          @(
            '<?xml version="1.0" encoding="UTF-8"?>'
            '<Settings>'
            "  <BaseUrl>$proxy/</BaseUrl>"
            '  <ContentFolder>content</ContentFolder>'
            '  <SilentCrashReport>1</SilentCrashReport>'
            '</Settings>'
          ) | Set-Content -Path AppSettings.xml -Encoding UTF8
          Get-Content AppSettings.xml | ForEach-Object { Write-Host "appsettings| $_" }

          # Start logging proxy
          $proxyLog = Join-Path $PWD "proxy.log"
          if (Test-Path $proxyLog) { Remove-Item $proxyLog }
          $proxyProc = Start-Process -FilePath "python" `
            -ArgumentList "..\tools\logging_proxy.py","--port","64989","--log","$proxyLog" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "proxy-stdout.log" -RedirectStandardError "proxy-stderr.log"
          Start-Sleep -Seconds 2
          if ($proxyProc.HasExited) {
            Write-Host "::error::logging_proxy exited immediately, code $($proxyProc.ExitCode)"
            Get-Content proxy-stdout.log, proxy-stderr.log | ForEach-Object { Write-Host "proxy| $_" }
            Pop-Location; exit 1
          }

          # Start RCC with a stub -PlaceId:1818 to force OpenJob; the job is
          # named "Test" per gameserver.txt semantics and tries to bind a
          # RakNet listener on the default game port.
          $rccProc = Start-Process -FilePath ".\RCCService.exe" `
            -ArgumentList "-Console","-PlaceId:1818" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "rcc-stdout.log" -RedirectStandardError "rcc-stderr.log"
          Start-Sleep -Seconds 3
          if ($rccProc.HasExited) {
            Write-Host "::error::RCCService exited during startup, code 0x$('{0:X}' -f $rccProc.ExitCode)"
            Get-Content rcc-stdout.log | ForEach-Object { Write-Host "rcc| $_" }
            Get-Content rcc-stderr.log | ForEach-Object { Write-Host "rcc-err| $_" }
            Stop-Process -Id $proxyProc.Id -Force -ErrorAction SilentlyContinue
            Pop-Location; exit 1
          }

          # Drive the client through the join handshake using the auth triple
          # that skips PlaceLauncher polling (per Application.cpp.md). The
          # proxy serves the join script as a Lua body, which the client
          # fetches via fetchJoinScriptAsync. This exercises the same network
          # code path a real join uses; only the graphics window (View
          # backend chain) is downstream, and that lives in workstream 6
          # under Wine+Xvfb.
          $clientArgs = @(
            "-a","$proxy/login/v1",
            "-t","sandbox-ticket",
            "-j","$proxy/Game/join.ashx"
          )
          $clientProc = Start-Process -FilePath ".\RobloxPlayerBetaRaw.exe" `
            -ArgumentList $clientArgs `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "client-stdout.log" -RedirectStandardError "client-stderr.log"

          # Hold for 30s — the client needs a few seconds to: LoadAppSettings,
          # FetchClientSettingsData, create the hidden window, hookApi anti-
          # tamper, and then start the login/join-script HTTP fetches against
          # the proxy. A pre-window graphics crash shows up here, and a
          # loader-class failure shows up almost immediately.
          $deadline = (Get-Date).AddSeconds(30)
          while (-not $clientProc.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          $clientStillUp = -not $clientProc.HasExited
          $rccStillUp    = -not $rccProc.HasExited
          $proxyStillUp  = -not $proxyProc.HasExited

          # Collect diagnostics either way.
          Write-Host "=== proxy log ==="
          if (Test-Path $proxyLog) { Get-Content $proxyLog }
          Write-Host "=== proxy stderr ==="
          Get-Content proxy-stderr.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "proxy-err| $_" }
          Write-Host "=== rcc stderr (last 40) ==="
          Get-Content rcc-stderr.log -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host "rcc-err| $_" }
          Write-Host "=== client stderr (last 60) ==="
          Get-Content client-stderr.log -ErrorAction SilentlyContinue | Select-Object -Last 60 | ForEach-Object { Write-Host "client-err| $_" }
          Write-Host "=== client stdout (last 40) ==="
          Get-Content client-stdout.log -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host "client| $_" }

          # Loader-class failures (>=0xC0000000) are not acceptable.
          $bad = $false
          if ($clientProc.HasExited -and $clientProc.ExitCode -ge 0xC0000000) {
            Write-Host "::error::client loader-class exit 0x$('{0:X}' -f $clientProc.ExitCode)"
            $bad = $true
          }
          if ($rccProc.HasExited -and $rccProc.ExitCode -ge 0xC0000000) {
            Write-Host "::error::rcc loader-class exit 0x$('{0:X}' -f $rccProc.ExitCode)"
            $bad = $true
          }

          # The proxy should have seen at least one request from each side
          # (RCC's Http init and the client's login fetch). If it saw nothing
          # the engine never tried to talk to the network, which means the
          # join path didn't actually run.
          $proxySawAnything = (Test-Path $proxyLog) -and ((Get-Content $proxyLog) | Where-Object { $_ -match '^\[req\] ' }).Count -gt 0
          if (-not $proxySawAnything) {
            Write-Host "::warning::logging_proxy saw no [req] entries - two-sided handshake did not exercise the network path"
          } else {
            $reqCount = (Get-Content $proxyLog | Where-Object { $_ -match '^\[req\] ' }).Count
            Write-Host "INTEGRATION_OK: proxy logged $reqCount request(s); both processes ran past loader init"
          }

          # Tear down.
          if (-not $clientProc.HasExited) { Stop-Process -Id $clientProc.Id -Force -ErrorAction SilentlyContinue }
          if (-not $rccProc.HasExited)    { Stop-Process -Id $rccProc.Id    -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1
          if (-not $proxyProc.HasExited)  { Stop-Process -Id $proxyProc.Id  -Force -ErrorAction SilentlyContinue }

          Pop-Location
          if ($bad) { exit 1 }
          Write-Host "TWO_SIDED_SMOKE_OK"
      - name: Publish Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "build-$([DateTime]::UtcNow.ToString('yyyyMMdd-HHmmss'))"
          gh release create $tag --repo bananamort/sandbox --title "Build $tag" --notes "Automated build from CI (run $env:GITHUB_RUN_ID)"
          gh release upload $tag bin/RCCService.exe bin/RobloxPlayerBetaRaw.exe --repo bananamort/sandbox