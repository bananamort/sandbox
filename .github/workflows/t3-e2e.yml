name: t3-e2e

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  t3:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Init MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Download RCCService from latest green build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $run = gh run list --workflow build --status success --limit 1 --json databaseId -q '.[0].databaseId' --repo bananamort/sandbox
          if (-not $run) { Write-Host "::error::no successful build run found"; exit 1 }
          Write-Host "using build run $run"
          gh run download $run -n rcc-exe --repo bananamort/sandbox -D bin
          if (-not (Test-Path bin/RCCService.exe)) { Get-ChildItem -Recurse bin; Write-Host "::error::RCCService.exe missing from rcc-exe"; exit 1 }
          Get-ChildItem bin | Select-Object Name, Length
      - name: Install era VC runtimes (x86)
        shell: cmd
        run: |
          choco install vcredist2012 vcredist2013 -y --ignore-package-exit-codes
      - name: Provision companion DLLs and runtime data
        shell: cmd
        working-directory: bin
        run: |
          copy /Y ..\roblox-sandbox\Library\VMProtect\stub\VMProtectSDK_stub.c . >nul
          copy /Y ..\roblox-sandbox\Library\VMProtect\stub\VMProtectSDK32.def . >nul
          cl /nologo /LD VMProtectSDK_stub.c /DEF VMProtectSDK32.def /FeVMProtectSDK32.dll /link /MACHINE:X86
          if not exist VMProtectSDK32.dll exit /b 1
          del VMProtectSDK_stub.c VMProtectSDK32.def VMProtectSDK_stub.obj VMProtectSDK_stub.lib VMProtectSDK_stub.exp >nul 2>&1
          echo void* __stdcall D3DXGetShaderConstantTable(unsigned long s) { return 0; } > d3dx9_35_stub.c
          echo LIBRARY d3dx9_35 > d3dx9_35.def
          echo EXPORTS >> d3dx9_35.def
          echo     D3DXGetShaderConstantTable >> d3dx9_35.def
          cl /nologo /LD d3dx9_35_stub.c /DEF d3dx9_35.def /Fed3dx9_35.dll /link /MACHINE:X86
          if not exist d3dx9_35.dll exit /b 1
          del d3dx9_35_stub.c d3dx9_35.def d3dx9_35_stub.obj d3dx9_35_stub.lib d3dx9_35_stub.exp >nul 2>&1
      - name: Copy fmod.dll
        shell: pwsh
        run: Copy-Item roblox-sandbox\fmod\win32\fmod.dll bin/
      - name: Copy SDL2.dll
        shell: pwsh
        run: |
          $sha = (Get-FileHash roblox-sandbox\Library\SDL2\lib\x86\SDL2.dll).Hash.ToLower()
          if ($sha -ne 'ce15334fe253ff38b887214f57bc76a7d4286a346ad09e909f21c4a640003f86') {
            Write-Host "::error::SDL2.dll hash mismatch: $sha"
            exit 1
          }
          Copy-Item roblox-sandbox\Library\SDL2\lib\x86\SDL2.dll bin\
      - name: Copy runtime data directories
        shell: pwsh
        run: |
          foreach ($d in @('content','shaders','PlatformContent')) {
            if (Test-Path "roblox-sandbox\$d") {
              Copy-Item -Path "roblox-sandbox\$d" -Destination bin\ -Recurse -Force
            }
          }
          foreach ($f in @(
            'roblox-sandbox/RCCService/AppSettings.xml',
            'roblox-sandbox/RCCService/gameserver.txt'
          )) {
            if (Test-Path $f) { Copy-Item $f bin\ }
          }
          Get-ChildItem bin | Select-Object Name, Length
      - name: Recursive import audit
        shell: pwsh
        run: python tools/audit_win_deps.py bin
      - name: Run pair 1 (unobfuscated_1 + obfuscated_1)
        shell: pwsh
        timeout-minutes: 12
        run: |
          Push-Location bin
          $env:RBX_CAPTURE_PATH = Join-Path $PWD "capture.jsonl"
          $env:RBX_FORCED_COVERAGE = "1"
          if (Test-Path $env:RBX_CAPTURE_PATH) { Remove-Item $env:RBX_CAPTURE_PATH }
          $rcc = Start-Process -FilePath ".\RCCService.exe" -ArgumentList "-Console","64990" -PassThru -NoNewWindow `
                   -RedirectStandardOutput "t3-stdout.log" -RedirectStandardError "t3-stderr.log"
          try {
            python ..\tools\t3_inject.py --port 64990 --probe --deadline 90
            if ($LASTEXITCODE -ne 0) { exit 1 }
            python ..\tools\t3_inject.py --port 64990 --open --job T3setup1 --name "t3setup" --file ..\tests\scripts\t3_setup_pair1.lua --out open-setup1.xml
            if ($LASTEXITCODE -ne 0) { exit 1 }
            python ..\tools\t3_inject.py --port 64990 --open --job T3u1 --name "unobfuscated_1" --file ..\tests\scripts\unobfuscated_1.lua --out open-u1.xml
            if ($LASTEXITCODE -ne 0) { exit 1 }
            python ..\tools\t3_inject.py --port 64990 --open --job T3o1 --name "obfuscated_1" --file ..\tests\scripts\obfuscated_1.lua --out open-o1.xml
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "all injected; holding for forced-coverage window"
            Start-Sleep -Seconds 60
          } finally {
            if (-not $rcc.HasExited) { Stop-Process -Id $rcc.Id -Force }
            Pop-Location
          }
          if (-not (Test-Path bin/capture.jsonl)) { Write-Host "::error::no capture.jsonl produced"; exit 1 }
          python tools/t3_inject.py --verify --capture bin/capture.jsonl --expect-chunk "=t3setup"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/t3_inject.py --verify --capture bin/capture.jsonl --expect-chunk "=unobfuscated_1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/t3_inject.py --verify --capture bin/capture.jsonl --expect-chunk "=obfuscated_1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/assert_capture.py bin/capture.jsonl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/reconstruct.py bin/capture.jsonl --out bin/reconstruction.md --emit-replay bin/replay
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path tests/output/pair1 | Out-Null
          Copy-Item bin/reconstruction.lua tests/output/pair1/reconstruction.lua
          Copy-Item bin/reconstruction.md tests/output/pair1/reconstruction.md
          Copy-Item bin/capture.jsonl tests/output/pair1/capture.jsonl
          Copy-Item bin/replay/replay.lua tests/output/pair1/replay.lua
          Write-Host "T3_PAIR1_OK"
      - name: Run pair 2 (unobfuscated_2 + obfuscated_2)
        shell: pwsh
        timeout-minutes: 12
        run: |
          Push-Location bin
          $env:RBX_CAPTURE_PATH = Join-Path $PWD "capture.jsonl"
          $env:RBX_FORCED_COVERAGE = "1"
          if (Test-Path $env:RBX_CAPTURE_PATH) { Remove-Item $env:RBX_CAPTURE_PATH }
          $rcc = Start-Process -FilePath ".\RCCService.exe" -ArgumentList "-Console","64991" -PassThru -NoNewWindow `
                   -RedirectStandardOutput "t3-stdout.log" -RedirectStandardError "t3-stderr.log"
          try {
            python ..\tools\t3_inject.py --port 64991 --probe --deadline 90
            if ($LASTEXITCODE -ne 0) { exit 1 }
            python ..\tools\t3_inject.py --port 64991 --open --job T3u2 --name "unobfuscated_2" --file ..\tests\scripts\unobfuscated_2.lua --out open-u2.xml
            if ($LASTEXITCODE -ne 0) { exit 1 }
            python ..\tools\t3_inject.py --port 64991 --open --job T3o2 --name "obfuscated_2" --file ..\tests\scripts\obfuscated_2.lua --out open-o2.xml
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "both injected; holding for forced-coverage window"
            Start-Sleep -Seconds 60
          } finally {
            if (-not $rcc.HasExited) { Stop-Process -Id $rcc.Id -Force }
            Pop-Location
          }
          if (-not (Test-Path bin/capture.jsonl)) { Write-Host "::error::no capture.jsonl produced"; exit 1 }
          python tools/t3_inject.py --verify --capture bin/capture.jsonl --expect-chunk "=unobfuscated_2"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/t3_inject.py --verify --capture bin/capture.jsonl --expect-chunk "=obfuscated_2"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/assert_capture.py bin/capture.jsonl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/reconstruct.py bin/capture.jsonl --out bin/reconstruction.md --emit-replay bin/replay
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path tests/output/pair2 | Out-Null
          Copy-Item bin/reconstruction.lua tests/output/pair2/reconstruction.lua
          Copy-Item bin/reconstruction.md tests/output/pair2/reconstruction.md
          Copy-Item bin/capture.jsonl tests/output/pair2/capture.jsonl
          Copy-Item bin/replay/replay.lua tests/output/pair2/replay.lua
          Write-Host "T3_PAIR2_OK"
      - name: Diagnose RCCService crash (minidump stack)
        if: failure()
        shell: pwsh
        run: |
          $logsDir = Join-Path $env:LOCALAPPDATA "Roblox\logs"
          Write-Host "diag| logs dir: $logsDir"
          $dumps = @()
          if (Test-Path $logsDir) {
            $dumps = Get-ChildItem -Path $logsDir -Recurse -Include *.dmp -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending
            $dumps | ForEach-Object { Write-Host "diag| dump: $($_.FullName) ($($_.Length) bytes)" }
          } else { Write-Host "diag| logs dir missing" }
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x86\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Host "diag| cdb not present, skipping stack analysis" }
          elseif ($dumps.Count -eq 0) { Write-Host "diag| no dumps found" }
          else {
            $dump = $dumps[0].FullName
            Push-Location bin
            try {
              $env:_NT_SYMBOL_PATH = "srv*;D:\a\sandbox\sandbox\bin"
              & "$cdb" -z "$dump" -c "!analyze -v;q" 2>&1 |
                ForEach-Object { Write-Host "stack| $_" }
            } catch { Write-Host "diag| cdb failed: $_" }
            Pop-Location
          }
      - name: Upload T3 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-output
          path: |
            tests/output/
            bin/t3-stdout.log
            bin/t3-stderr.log
            bin/open-*.xml
            bin/exec-*.xml
          if-no-files-found: warn
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs
          path: |
            bin/t3-stdout.log
            bin/t3-stderr.log
            ${{ env.LOCALAPPDATA }}\Roblox\logs\
          if-no-files-found: warn
